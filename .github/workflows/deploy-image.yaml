name: Create and Publish a Docker Image

# Build and test pull requests. Publish only pushes to main.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: parksnoopy/debian-slim-zsh

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: write
      packages: write

    steps:
      - name: actions/checkout@v6 - Check Out Repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: bash - Test Installer
        run: bash tests/init.bash

      - name: bash - Set Image Tag
        id: tag
        run: |
          set -euo pipefail
          version="$(<.version)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Invalid .version: expected a bare major.minor.patch version.' >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            refs="$(git ls-remote --refs --tags origin "refs/tags/$version-*")"
            latest=0
            while read -r commit ref; do
              suffix="${ref#refs/tags/$version-}"
              [[ "$ref" == "refs/tags/$version-$suffix" && "$suffix" =~ ^[0-9]{3,}$ ]] || continue
              number=$((10#$suffix))
              if (( number > latest )); then
                latest="$number"
              fi
            done <<< "$refs"
            printf -v image_tag '%s-%03d' "$version" "$((latest + 1))"
          else
            image_tag="$version-pr-$GITHUB_RUN_ID"
          fi
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_OUTPUT"

      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: docker/login-action@v4 - Log in to the Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: docker/metadata-action@v6 - Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build locally so runtime tests gate publication of this exact image.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see [Usage](https://github.com/docker/build-push-action#usage) in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: docker/build-push-action@v7 - Build Docker Image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: bash - Test Nested Podman
        timeout-minutes: 10
        env:
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          # Privileged only for this disposable nested-engine smoke test.
          docker run --rm --privileged --user 0:0 \
            --volume "$PWD/tests/compose.yaml:/tmp/nested-compose.yaml:ro" "$TEST_IMAGE" \
            /usr/local/bin/as-admin /usr/bin/zsh -lexc '
              ~/init.sh install podman -y
              [[ "$(sudo -n bash -c "command -v podman")" == /usr/local/bin/podman ]]
              output="$(sudo -n podman run docker.io/library/hello-world:latest)"
              printf "%s\n" "$output"
              [[ "$output" == *"Hello from Docker!"* ]]
              [[ "$(sudo -n bash -c "command -v podman-compose")" == /usr/local/bin/podman-compose ]]
              compose_file=/tmp/nested-compose.yaml
              trap "sudo -n podman-compose -p nested-smoke -f \"$compose_file\" down" EXIT
              sudo -n podman-compose -p nested-smoke -f "$compose_file" up -d
              sudo -n podman wait nested-smoke_smoke_1
              [[ "$(sudo -n podman inspect --format "{{.State.ExitCode}}" nested-smoke_smoke_1)" == 0 ]]
              [[ "$(sudo -n podman inspect --format "{{.HostConfig.AutoRemove}}" nested-smoke_smoke_1)" == false ]]
              output="$(sudo -n podman logs nested-smoke_smoke_1)"
              printf "%s\n" "$output"
              [[ "$output" == *"Hello from Docker!"* ]]
              sudo -n podman-compose -p nested-smoke -f "$compose_file" down
              status=0
              sudo -n podman container exists nested-smoke_smoke_1 || status=$?
              [[ "$status" == 1 ]]
              trap - EXIT
            '

      - name: bash - Test Container Lifecycle
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        env:
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
        run: bash tests/container.bash "$TEST_IMAGE"

      - name: bash - Publish Tested Image
        if: github.event_name == 'push'
        env:
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          docker push "$TEST_IMAGE"
          remote_id="$(docker manifest inspect "$TEST_IMAGE" | jq -er '.config.digest')"
          [[ "$remote_id" == "$(docker image inspect --format '{{.Id}}' "$TEST_IMAGE")" ]]

      - name: bash - Publish Git Tag
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          git tag "$IMAGE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$IMAGE_TAG"
          ref="$(git ls-remote --exit-code --refs origin "refs/tags/$IMAGE_TAG")"
          [[ "$ref" == "$GITHUB_SHA"$'\t'"refs/tags/$IMAGE_TAG" ]]
